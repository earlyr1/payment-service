name: payment-service

# Defaults are for local development only. Override secrets via environment or a .env file (see .env.example).
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payments}:${POSTGRES_PASSWORD:-payments}@postgres:5432/${POSTGRES_DB:-payments}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-payments}:${RABBITMQ_PASSWORD:-payments}@rabbitmq:5672/
  API_KEY: ${API_KEY:-dev-api-key-change-me-0123456789}
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-secret-change-me-0123}
  # Lets the consumer call the demo receiver inside the compose network. Never enable in production.
  WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}

x-app: &app
  build: .
  image: payment-service:local
  restart: unless-stopped
  environment: *app-env
  depends_on: &app-depends
    migrate:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payments}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payments}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq  # the node name, and thus the data directory, depends on it
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-payments}
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["python", "-m", "payment_service.api"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  outbox-relay:
    <<: *app
    command: ["python", "-m", "payment_service.outbox"]

  consumer:
    <<: *app
    command: ["python", "-m", "payment_service.consumer"]
    stop_grace_period: 45s  # lets in-flight payments finish (graceful timeout is 30s)

  webhook-receiver:
    <<: *app
    command: ["python", "-m", "payment_service.devtools.webhook_receiver"]
    environment:
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-secret-change-me-0123}
      PORT: "9000"
    ports:
      - "${WEBHOOK_RECEIVER_PORT:-9000}:9000"
    depends_on: []

volumes:
  postgres-data:
  rabbitmq-data:
