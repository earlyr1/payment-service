[project]
name = "payment-service"
version = "0.1.0"
description = "Asynchronous payment processing service: FastAPI + PostgreSQL + RabbitMQ (transactional outbox, retries, DLQ)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0,<2",
    "asyncpg>=0.32.0,<0.33",
    "fastapi>=0.143.1,<0.144",
    "faststream[rabbit]>=0.7.7,<0.8",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16.0,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "RET", "TID", "DTZ", "PL"]
ignore = [
    "PLR0913",  # explicit keyword-only constructors are fine
    "PLR2004",  # magic values in comparisons (HTTP codes etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (PostgreSQL and RabbitMQ are started with testcontainers)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
